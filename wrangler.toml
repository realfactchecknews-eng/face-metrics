name = "face-metrics-ai"
main = "worker.js"
compatibility_date = "2025-01-01"
account_id = "61c9a32c26ea67b8457a73c9e71b752e"

# Rate limit. Создай namespace:  wrangler kv namespace create RATE_LIMIT
# Вставь выданный id вместо PASTE_KV_ID_HERE и задеплой:  wrangler deploy
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "252f7860538642e0a684414741893076"

# Не-секретные переменные. Замени на свой @username бота (без @).
[vars]
BOT_USERNAME = "faceratepay_bot"

# Раз в час проверяет, не истёк ли активный розыгрыш (giveaway:current) — если да, сам
# выбирает победителей, начисляет анализы и уведомляет. См. scheduled() в worker.js.
[triggers]
crons = ["0 * * * *"]

# Хранение логов (console.log + исключения) — без этого доступен только живой `wrangler tail`,
# и разбирать жалобу «час назад была ошибка» нечем. Нужно для диагностики пустых ответов ИИ.
[observability]
enabled = true

# Секреты (НЕ хранить здесь) — задать через wrangler secret put:
#   wrangler secret put OPENROUTER_API_KEY
#   wrangler secret put TG_BOT_TOKEN
#   wrangler secret put TG_WEBHOOK_SECRET
#   wrangler secret put YUKASSA_PROVIDER_TOKEN   # карты РФ (ЮKassa provider_token из BotFather)
#   wrangler secret put CRYPTOBOT_TOKEN          # Crypto Pay API token из @CryptoBot
