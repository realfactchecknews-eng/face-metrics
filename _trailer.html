<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>FaceRate — трейлер</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet" />
<style>
  :root{ --accent:#c4a46b; --ink:#f4efe6; --bg:#06060a; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;overflow:hidden}
  body{font-family:'Cormorant Garamond',Georgia,serif}

  #fit{position:fixed;inset:0;overflow:hidden}
  #stage{width:1080px;height:1920px;position:absolute;left:50%;top:50%;overflow:hidden;
    transform-origin:50% 50%;transform:translate(-50%,-50%) scale(1);
    background:radial-gradient(115% 75% at 50% 20%,#12121a 0%,var(--bg) 60%);color:var(--ink)}

  /* каждая сцена живёт в своём окне времени, соседние не пересекаются */
  .scene{position:absolute;inset:0;opacity:0;display:grid;place-content:center;justify-items:center;
    text-align:center;padding:0 90px}
  .play .scene{animation:fade var(--dur) var(--at) both}
  @keyframes fade{0%{opacity:0}6%{opacity:1}92%{opacity:1}100%{opacity:0}}
  @keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
  @keyframes track{from{opacity:0;letter-spacing:.6em}to{opacity:1;letter-spacing:.34em}}
  @keyframes wide{to{width:var(--w)}}
  @keyframes grow{to{transform:scaleX(1)}}
  @keyframes ring{to{stroke-dashoffset:268}}
  @keyframes sweep{from{top:-6%}to{top:106%}}
  @keyframes breathe{0%,100%{text-shadow:0 0 50px rgba(196,164,107,.28)}50%{text-shadow:0 0 100px rgba(196,164,107,.55)}}

  /* 1 — балл */
  #s1{--at:.15s;--dur:3.3s}
  .score{font-size:440px;font-weight:300;line-height:.85;color:var(--accent)}
  .play .score{animation:breathe 3s .3s ease-in-out infinite}
  .tier{margin-top:40px;font-size:60px;letter-spacing:.34em;text-transform:uppercase}
  .play .tier{animation:track 1.1s 1.4s both}
  .rule{height:1px;width:0;background:var(--accent);opacity:.55;margin:46px 0 0}
  .play #s1 .rule{--w:400px;animation:wide 1.1s 1.9s both}
  .sub{margin-top:28px;font-size:42px;opacity:.4;letter-spacing:.24em}
  .play .sub{animation:rise 1s 2.1s both}

  /* 2 — вопрос */
  #s2{--at:3.55s;--dur:2.3s}
  #s2 p{font-size:92px;font-weight:300;opacity:.92}

  /* 3 — скан */
  #s3{--at:6.0s;--dur:7.0s;place-content:stretch;padding:0}
  .shot{position:absolute;inset:0;overflow:hidden}
  .shot img{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);
    width:1420px;max-width:none;filter:contrast(1.06) saturate(1.05)}
  .shot::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(6,6,10,.75) 0%,transparent 22%,transparent 58%,rgba(6,6,10,.92) 88%)}
  .beam{position:absolute;left:0;width:100%;height:4px;z-index:2;
    background:linear-gradient(90deg,transparent,var(--accent) 20%,#fff4dd 50%,var(--accent) 80%,transparent);
    box-shadow:0 0 60px 14px rgba(196,164,107,.5)}
  .play .beam{animation:sweep 5.6s 6.5s cubic-bezier(.42,0,.58,1) both}
  .readout{position:absolute;left:96px;bottom:250px;z-index:3;text-align:left}
  .readout div{font-size:40px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
    margin-bottom:26px;opacity:0}
  .readout b{color:var(--ink);font-weight:400;margin-left:20px;letter-spacing:.06em}
  .play .readout div{animation:rise .7s both}
  .play .r1{animation-delay:7.6s} .play .r2{animation-delay:8.5s} .play .r3{animation-delay:9.4s}
  .cap{position:absolute;left:0;right:0;bottom:140px;z-index:3;font-size:44px;
    letter-spacing:.2em;opacity:0;color:rgba(244,239,230,.6)}
  .play .cap{animation:rise .9s 10.6s both}

  /* 4 — категории */
  #s4{--at:13.3s;--dur:5.2s}
  .cats{width:800px}
  .cat{opacity:0;margin-bottom:34px}
  .play .cat{animation:rise .55s both}
  .cat .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
  .cat .row span{font-size:38px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
  .cat .row em{font-style:normal;font-size:42px;color:var(--accent)}
  .bar{height:3px;background:rgba(244,239,230,.12)}
  .bar i{display:block;height:100%;background:var(--accent);transform:scaleX(0);transform-origin:left}
  .play .bar i{animation:grow .8s cubic-bezier(.3,1,.4,1) both}

  /* 5 — перцентиль */
  #s5{--at:18.8s;--dur:4.4s}
  .ring{position:relative;width:520px;height:520px;display:grid;place-items:center}
  .ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:6}
  .ring .bg{stroke:rgba(244,239,230,.11)}
  .ring .fg{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:1030;stroke-dashoffset:1030}
  .play .ring .fg{animation:ring 1.8s 19.2s cubic-bezier(.3,1,.4,1) both}
  .pctnum{font-size:210px;font-weight:300;color:var(--accent);line-height:1}
  .pctcap{margin-top:56px;font-size:54px;font-weight:300;opacity:.85;line-height:1.5}
  .play .pctcap{animation:rise 1s 20.3s both}

  /* 6 — финал */
  #s6{--at:23.4s;--dur:4.2s}
  .logo{font-size:130px;font-weight:300;letter-spacing:.22em}
  .play .logo{animation:track 1.3s 23.6s both}
  .play #s6 .rule{--w:340px;animation:wide 1.2s 24.3s both;margin:50px 0}
  .url{font-size:84px;color:var(--accent);letter-spacing:.1em}
  .play .url{animation:rise 1s 24.7s both}
  .kick{margin-top:42px;font-size:44px;opacity:.45;letter-spacing:.2em}
  .play .kick{animation:rise 1.1s 25.3s both}

  #ui{position:fixed;left:18px;bottom:18px;z-index:9;display:flex;gap:12px;align-items:center;
    font:13px/1.4 -apple-system,system-ui,sans-serif;color:#8b8b93}
  #ui button{font:inherit;color:#0b0b0d;background:var(--accent);border:0;border-radius:7px;padding:9px 16px;cursor:pointer}
  #ui kbd{background:#1b1b21;border-radius:4px;padding:2px 6px;color:#c9c9d1}
  body.clean #ui{display:none}
</style>
</head>

<script>
(function(){
  var stage=document.getElementById('stage');

  var CATS=[['Симметрия',7.8],['Глаза',7.9],['Мидфейс',7.2],['Джолайн',7.6],
            ['Нос',6.9],['Губы и скулы',7.4],['Кожа',7.1],['Груминг',7.5]];
  var list=document.getElementById('catList');
  CATS.forEach(function(c,i){
    var d=document.createElement('div'); d.className='cat';
    d.style.animationDelay=(13.5+i*0.15).toFixed(2)+'s';
    d.innerHTML='<div class="row"><span>'+c[0]+'</span><em>'+c[1].toFixed(1)+'</em></div>'+
      '<div class="bar"><i style="width:'+(c[1]*10)+'%;animation-delay:'+(13.6+i*0.15).toFixed(2)+'s"></i></div>';
    list.appendChild(d);
  });

  function countUp(el,to,dur,delay,dec){
    setTimeout(function(){var t0=null;
      (function step(t){ if(!t0)t0=t;
        var k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3);
        el.textContent=(to*e).toFixed(dec);
        if(k<1) requestAnimationFrame(step); else el.textContent=to.toFixed(dec);
      })(performance.now());
    },delay);
  }

  function run(){
    stage.classList.remove('play'); void stage.offsetWidth; stage.classList.add('play');
    countUp(document.getElementById('scoreNum'),7.4,1500,350,1);
    countUp(document.getElementById('pctNum'),74,1700,19300,0);
  }
  function fit(){ var s=Math.min(innerWidth/1080,innerHeight/1920);
    stage.style.transform='translate(-50%,-50%) scale('+s+')'; }

  addEventListener('resize',fit); fit();
  document.getElementById('replay').onclick=run;
  addEventListener('keydown',function(e){
    if(e.key==='h'||e.key==='H') document.body.classList.toggle('clean');
    if(e.key===' '){e.preventDefault(); run();}
  });
  run();
})();
