name: Deploy to GitHub Pages

# Официальный Pages-пайплайн (upload-pages-artifact + deploy-pages).
# Заменил ветку gh-pages + peaceiris: внутренний branch-билд GitHub падал
# с «Deployment failed, try again later» и не публиковал новую версию.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage static site
        run: |
          mkdir -p _site
          cp -R \
            index.html app.js style.css \
            glossary.html glossary-en.html terms.html terms-en.html privacy.html privacy-en.html \
            fwhr.html psl-shkala.html psl-tiers.html canthal-tilt.html feedback.html \
            favicon.svg favicon-32.png favicon-180.png favicon-512.png og.png how-scan.jpg music.mp3 CNAME \
            robots.txt sitemap.xml yandex_*.html google*.html \
            vendor assets \
            _site/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
