name: Deploy Cloudflare Worker

# Автодеплой воркера: при пуше изменений worker.js/wrangler.toml в master
# воркер выкатывается в Cloudflare сам, без локального `wrangler deploy`.
# Требуется секрет CLOUDFLARE_API_TOKEN (Settings → Secrets and variables → Actions).
#
# Деплой напрямую через npm+wrangler: cloudflare/wrangler-action@v3 падал
# на установке wrangler под Node 24 (`npx --no-install wrangler --version`).

on:
  push:
    branches: [master]
    paths:
      - 'worker.js'
      - 'wrangler.toml'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install wrangler
        run: npm install -g wrangler@4
      - name: Deploy to Cloudflare Workers
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Если у токена доступ к нескольким аккаунтам — добавь секрет и раскомментируй:
          # CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
